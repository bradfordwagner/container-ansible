name: container-branches
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch: {}
env:
  DAGGER_VERSION: 0.21.11
  version: latest
jobs:
  product:
    name: product
    runs-on: ubuntu-26.04
    outputs:
      product: ${{ steps.config.outputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: dagger=${{ env.DAGGER_VERSION }}
        run: |
          curl -L https://dl.dagger.io/dagger/install.sh | sh
      - name: dagger=product
        id: config
        run: |
          # write your own scoped version of the following since https://github.com/bradfordwagner/dagger-container-builds@0.4.1 is not available at this base level
          set -x
          echo product=$(./bin/dagger -m https://github.com/bradfordwagner/dagger-container-builds@0.4.1 call product-json --src=. --version=${{ env.version }}) >> $GITHUB_OUTPUT
  builds:
    # arm64 goes to the cicd ARC runners while any Mac serves them (ARC_HOSTS), else the hosted arm runner.
    runs-on: ${{ vars.ARC_HOSTS != '' && matrix.product.runner == 'ubuntu-24.04-arm' && 'arc-arm64' || matrix.product.runner }}
    permissions: write-all
    needs: product
    name: ${{ matrix.product.display }}
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.product.outputs.product) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: dagger=${{ env.DAGGER_VERSION }}
        run: |
          curl -L https://dl.dagger.io/dagger/install.sh | sh
      
      # work around other runner's logging out removing credentials
      # https://github.com/docker/login-action/issues/173#issuecomment-1079688020
      - name: Set DOCKER_CONFIG
        run: |
          id=docker_configs/${RANDOM}
          mkdir -p $HOME/${id}/.docker
          echo "DOCKER_CONFIG=$HOME/${id}/.docker" >> $GITHUB_ENV
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        name: login=ghcr.io
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false
      - name: dagger=build
        id: config
        env:
          # on ARC, pull the engine through the hl_k3d ghcr cache
          _EXPERIMENTAL_DAGGER_RUNNER_HOST: ${{ vars.ARC_HOSTS != '' && matrix.product.runner == 'ubuntu-24.04-arm' && format('docker-image://host.k3d.internal:5002/dagger/engine:v{0}', env.DAGGER_VERSION) || '' }}
        run: |
          ./bin/dagger -m https://github.com/bradfordwagner/dagger-container-builds@0.4.1 call build \
            --progress=plain \
            --src=. \
            --index=${{ matrix.product.index }} \
            --version=${version}
  manifest:
    runs-on: ubuntu-latest
    permissions: write-all
    needs: builds
    name: manifest-tool
    env:
      actor: ${{ github.actor }}
      token: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: dagger=${{ env.DAGGER_VERSION }}
        run: |
          curl -L https://dl.dagger.io/dagger/install.sh | sh
      # work around other runner's logging out removing credentials
      # https://github.com/docker/login-action/issues/173#issuecomment-1079688020
      - name: Set DOCKER_CONFIG
        run: |
          id=docker_configs/${RANDOM}
          mkdir -p $HOME/${id}/.docker
          echo "DOCKER_CONFIG=$HOME/${id}/.docker" >> $GITHUB_ENV
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        name: login=ghcr.io
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false
      - name: dagger=manifest
        id: config
        run: |
          set -x
          ./bin/dagger -m https://github.com/bradfordwagner/dagger-container-builds@0.4.1 call manifest \
            --src=. \
            --version=${version} \
            --actor=env:actor \
            --token=env:token
