target_repo: ghcr.io/bradfordwagner/ansible
flavor: custom
upstream:
  repo: ghcr.io/bradfordwagner/base
  tag: 4.7.0
builds:
  - os: alpine_3.22
    archs:
      - linux/amd64
      - linux/arm64
    args:
      pkg_installer: alpine
  - os: alpine_3.23
    archs:
      - linux/amd64
      - linux/arm64
    args:
      pkg_installer: alpine
  - os: alpine_3.24
    archs:
      - linux/amd64
      - linux/arm64
    args:
      pkg_installer: alpine
  - os: archlinux_latest
    archs:
      - linux/amd64
    args:
      pkg_installer: arch
  - os: debian_trixie
    archs:
      - linux/amd64
      - linux/arm64
    args:
      pkg_installer: debian
  - os: debian_trixie-slim
    archs:
      - linux/amd64
      - linux/arm64
    args:
      pkg_installer: debian
  - os: debian_forky
    archs:
      - linux/amd64
      - linux/arm64
    args:
      pkg_installer: debian
  - os: debian_forky-slim
    archs:
      - linux/amd64
      - linux/arm64
    args:
      pkg_installer: debian
  - os: ubuntu_noble
    archs:
      - linux/amd64
      - linux/arm64
    args:
      pkg_installer: debian
  - os: ubuntu_resolute
    archs:
      - linux/amd64
      - linux/arm64
    args:
      pkg_installer: debian
